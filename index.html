<style>
:root{--we:#eef0fb;--weh:#e0e5f7;--bg:#f6f7f9;--fg:#1d2330;--mut:#6b7385;--line:#dfe3ea;--card:#fff;--acc:#3b6df0}
@media(prefers-color-scheme:dark){:root{--we:#1a1d2c;--weh:#232842;--bg:#14171d;--fg:#e8ebf1;--mut:#8b93a5;--line:#2a2f3a;--card:#1c2029;--acc:#6b93ff}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden}
main{display:flex;height:100vh}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.d{color:#d33}
button:disabled{opacity:.4;cursor:default}
/* sidebar */
aside{position:relative;width:var(--sbw,290px);flex-shrink:0;border-right:1px solid var(--line);background:var(--card)}
aside.collapsed{width:46px}
#sbin{height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column}
#sbin>*{flex-shrink:0}
.rs{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:40}.rs:hover{background:var(--acc);opacity:.35}
aside.collapsed .rs,aside.collapsed .sbbody,aside.collapsed .lang,aside.collapsed .ttl,aside.collapsed .fav{display:none}
aside.collapsed #sbin{padding:12px 8px}aside.collapsed .sbtop{justify-content:center;flex-direction:column}
.sbtop{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.fav{width:22px;height:22px}.ttl{font-weight:700;font-size:15px;flex:1;min-width:0}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.bgrid .full{grid-column:1/-1}
.bgrid button{font-size:12px;padding:6px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgrid svg{width:15px;height:15px;flex-shrink:0}
.tip{cursor:help;color:var(--acc);text-transform:none}
.sch{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.sch input[type=text]{flex:1 1 80px;min-width:0;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:3px 4px;border-radius:6px}
.sch input[type=text]:focus{border-color:var(--line)}
.sch .x{padding:0 6px;border:0;color:var(--mut)}
.sch .solo{font-size:11px;padding:1px 6px;border:1px solid var(--line);color:var(--mut)}
.sch .ic{flex-shrink:0}
.tbar{display:flex;gap:6px;margin-bottom:4px}.tbar button{flex:1;padding:7px 0;display:flex;justify-content:center;align-items:center}.tbar svg{width:17px;height:17px}
.pbtn{width:100%;margin-bottom:8px;padding:8px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.sech{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.shbtn{flex:1;display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.shbtn svg{width:14px;height:14px}.shbtn em{font-style:normal;font-weight:400;background:var(--bg);border-radius:10px;padding:0 7px}
.sch{min-height:32px;margin-bottom:2px;flex-wrap:nowrap}.sch.off input[type=text]{color:var(--mut)}
.omenu .oi svg{width:15px;height:15px;flex-shrink:0}.omenu .oi.d{color:#d33}.omenu .opw{color:var(--mut);cursor:default}.omenu .opw input{flex:1;min-width:0;accent-color:var(--acc)}
aside.collapsed .help{display:none}
.sch .opr{flex:0 0 calc(100% - 28px);min-width:0;margin:0 0 4px 28px;display:flex;align-items:center;gap:4px;color:var(--mut)}
.sch .opr .ic{margin:0}.sch .op{flex:1;min-width:0;width:auto;margin:0;accent-color:var(--acc);height:14px}
.eye{border:0;background:none;padding:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex-shrink:0}
.eye svg{width:19px;height:19px}.eye.off{color:var(--mut)}.eye.lk{color:#e8912d}
.ic{display:inline-flex;vertical-align:-3px;margin:0 4px 0 0}.ic svg{width:15px;height:15px}
.pick{cursor:pointer}.pick svg{width:19px;height:19px}
.hint{color:var(--mut);font-size:12px;margin:14px 0 0}
.lang{margin-top:auto;padding-top:16px}.lang label{margin:0 0 3px}
.lang select{width:100%;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
/* grid */
.wrap{flex:1;overflow:auto;position:relative;min-width:0}
.grid{display:grid}
.dh{position:sticky;top:0;z-index:20;background-color:var(--card);background-image:linear-gradient(var(--line),var(--line));background-size:1px 100%;background-repeat:no-repeat;background-position:var(--lane,0px) 0;border-bottom:1px solid var(--line);padding:8px 8px 8px calc(8px + var(--lane,0px));text-align:center;font-weight:600}
.dh.we{background-color:var(--weh)}.day.we,.lane.we{background-color:var(--we)}.dh.c{background-image:none;padding-left:8px}
.dw{display:flex;min-width:0}.lane{flex:0 0 var(--lane,0px);width:var(--lane,0px);position:relative}.day{flex:1;min-width:0}
.lane .lbg{position:absolute;left:0;right:0}
.dh:not(.c){cursor:pointer}.dh:not(.c):hover{text-decoration:underline}.dh .ic{color:var(--mut)}
.times{position:relative}.times span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mut);white-space:nowrap}
.day{position:relative;border-left:1px solid var(--line);user-select:none;touch-action:none}
.gl{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 7px;color:#fff;overflow:hidden;cursor:grab;font-size:12px;box-shadow:0 1px 3px #0003;border:1px solid #0002}
.ev.locked{pointer-events:none;cursor:default}
.ev .t{position:relative;z-index:3;font-weight:600;text-shadow:0 1px 2px #0008;display:block}
.ev .m{position:relative;z-index:3;opacity:.95;text-shadow:0 1px 2px #0008;display:block;line-height:1.25}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;z-index:4}
.ev .ic{background:#fff;border-radius:50%;padding:1px;vertical-align:-4px}
.ev .flags{position:absolute;top:3px;right:4px;z-index:5;display:flex;gap:3px;color:#fff;pointer-events:none}
.ev .flags span{display:flex}.ev .flags svg{width:13px;height:13px;filter:drop-shadow(0 1px 1px #000a)}
.ov{position:absolute;left:3px;right:3px;z-index:2;pointer-events:none;border-radius:4px}
.ghost{position:absolute;left:3px;right:3px;background:var(--acc);opacity:.3;border-radius:8px;pointer-events:none}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid #e5342d;z-index:6;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#e5342d}
/* dialogs & popups */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:18px;width:min(540px,95vw)}
dialog::backdrop{background:#0006}#xDlg{width:min(460px,95vw)}#xDlg h3{margin:0 0 10px}.note{color:var(--mut);font-size:12px}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mut)}
dialog input[type=text],dialog textarea,dialog select{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}.row>div{flex:1}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px}.chk label,.radios label{display:flex;gap:5px;align-items:center;margin:2px 0;color:var(--fg);font-size:13px}
.btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}.btns .d{margin-right:auto}
.swatch{width:100%;height:32px;border-radius:8px;padding:0}
.dr{display:flex;gap:6px;align-items:center;margin:3px 0}.dr label{margin:0;width:50px;display:flex;gap:5px;align-items:center;color:var(--fg);font-size:13px}
.dr select{flex:1;width:auto;min-width:0;font-size:12px;padding:5px 3px}.dr select:nth-of-type(3){flex:1.7}.wn{flex:0 0 18px;color:#e8912d;visibility:hidden;display:flex}.wn svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;margin:14px 0 2px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--mut)}.tabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.br{display:flex;gap:6px;align-items:center;margin:4px 0}.br select{flex:1;min-width:0;width:auto;font-size:12px;padding:5px 3px}.br select.bd{flex:0 0 62px}.br select.bp{flex:1.5}.br .bx{padding:0 6px;border:0;background:none;color:#d33;flex:0 0 auto}.br .bx:disabled{opacity:.25}
#fAddBlock{margin-top:4px;font-size:12px}
.pbx{position:absolute;left:0;right:0;pointer-events:none;overflow:hidden}
.pmode .pbx{pointer-events:auto;cursor:grab}
.pbg{position:absolute;inset:0}
.pbx .pl{position:relative;display:block;font-size:11px;font-weight:600;padding:2px 6px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbx .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.pbx.sel{box-shadow:inset 0 0 0 3px var(--acc)}
.lip{position:absolute;left:0;right:0;border-radius:7px 0 0 7px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;z-index:3;cursor:default}
.lip span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;padding:2px 0}
.pmode .lip{cursor:grab}
.pmode .ev{pointer-events:none!important;opacity:.35!important;filter:saturate(.4)}.pmode .ov{opacity:.3!important}
.wrap.pm{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--acc) 45%,transparent)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}.seg button{flex:1;border:0;border-radius:0;padding:6px;background:var(--card)}.seg button.on{background:var(--acc);color:#fff}
#dlg.per .ev-only{display:none!important}#dlg:not(.per) .per-only{display:none}
.ev.sel{z-index:1;box-shadow:0 0 0 2px var(--acc),0 1px 3px #0003}.warnline{color:#c97a00;font-size:12px;margin-top:4px}.dr.off select{opacity:.4}
.err{color:#d33;font-size:12px;min-height:16px;margin-top:6px}
.cpop{position:fixed;z-index:9999;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;width:240px;box-shadow:0 8px 28px #0005}
.sws{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:8px}.sw{height:20px;border-radius:5px;border:1px solid #0003;padding:0}
.cpop input[type=range]{width:100%;margin:2px 0}.cpr{display:flex;gap:6px;align-items:center;margin:6px 0}
.cpr .pv{width:34px;height:28px;border-radius:6px;border:1px solid var(--line);flex-shrink:0}
.cpr input[type=text]{flex:1;min-width:0;font:inherit;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.cpop .btns{margin-top:6px}
.omenu{position:fixed;z-index:9999;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 28px #0005;min-width:210px;max-width:300px}
.omenu .oh{font-size:11px;color:var(--mut);padding:2px 6px 4px}
.omenu .oi{display:flex;gap:8px;align-items:center;width:100%;border:0;text-align:left;padding:5px 6px}
.oi i{width:12px;height:12px;border-radius:3px;flex-shrink:0}.oi small{color:var(--mut);margin-left:auto;white-space:nowrap}
#hid{position:fixed;right:16px;bottom:16px;z-index:50;border-radius:20px;background:var(--card);box-shadow:0 2px 10px #0004;font-size:12px;padding:5px 12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10000}#toast.on{opacity:1}#toast.act{pointer-events:auto}#toast button{margin-left:10px;padding:2px 10px;font-size:12px;background:#fff;color:#222;border-radius:12px;border:0}
.sopt{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:var(--fg);font-size:14px}.sopt input{margin-top:3px}.sopt small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.ssec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
/* agenda & print */
.agenda h1,#pr h1{font-size:18px;margin:0 0 6px}
.pg{margin-top:6px}.pt{margin-left:18px;font-variant-numeric:tabular-nums}
#pr .grid.one{width:560px;zoom:1}
.pm{font-size:12px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.ai{display:flex;gap:12px;border-left:5px solid;padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px;break-inside:avoid}
.at{width:140px;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums}
.atl{font-weight:600;font-size:15px}.am{font-size:12px;color:var(--mut);margin-top:2px}.ad{margin-top:4px;white-space:pre-wrap}
#agBody{max-height:60vh;overflow:auto;margin-bottom:6px}
#pr{display:none}
@media print{
 body>*:not(#pr){display:none!important}
 body{display:block;height:auto;overflow:visible;background:#fff}
 #pr{display:block;color:#111;background:#fff;--fg:#111;--mut:#555;--line:#cfd4dd;--card:#fff;--bg:#f4f5f7;--we:#eef0fb;--weh:#e0e5f7}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #pr .grid{width:880px;min-width:0!important;zoom:.78}
 #pr .dh{position:static;cursor:default}#pr .dh .ic{display:none}
}

function normHex(h){h=String(h).trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(h))h=h.replace(/./g,'$&$&');return /^[0-9a-f]{6}$/i.test(h)?'#'+h.toLowerCase():null}
function hexToHsl(hex){
  const n=parseInt(normHex(hex).slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;const l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [h,s,l];
}
function hslToHex(h,s,l){
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  const [R,G,B]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[R,G,B].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function shiftColor(hex,used){
  const [h,s,l]=hexToHsl(hex),me=normHex(hex);
  const first=l>=.5?[-.18,.18,-.3,.3]:[.18,-.18,.3,-.3];
  const cands=first.map(dl=>hslToHex(h,s,Math.min(.78,Math.max(.22,l+dl))));
  return cands.find(c=>c!==me&&!used.includes(c))||cands.find(c=>c!==me)||hex;
}
function randomColor(used){let c;for(let i=0;i<30;i++){c=hslToHex(Math.random()*360,.55+Math.random()*.25,.42+Math.random()*.12);if(!used.includes(c))break}return c}

  items.forEach(it=>{const {e,s}=it;const b=el('button','oi',m);b.innerHTML=`<i style="background:${esc(e.color)}"></i><b>${esc(e.title)}</b><small>${esc((group?'':DAYS[s.day].slice(0,3)+' ')+fmt(s.start)+'–'+fmtEnd(s.end))}</small>`;b.onclick=()=>{close();onPick(e,it)}});

function openCopy(src){

  const body=el('div');el('p','note',body).textContent=L('cpNote');

  const o=lst.find(s=>!mem.includes(s.id));if(o)sel.value=o.id;

  modes.forEach(([m,k])=>{const l=el('label','',rd),i=el('input','',l);i.type='radio';i.name='cpm';i.value=m;rad[m]=i;l.append(L(k));

      sw.onclick=e=>{e.preventDefault();pickColor(sw,pv,c=>{pv=c;sw.style.background=c;rad.pick.checked=true})}}});

    {label:L('cpDo'),cls:'p',fn:()=>{

    {label:L('cancel'),dismiss:true}]});

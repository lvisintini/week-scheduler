<html lang="en"><head><meta charset="utf-8">

<title>Weekly Schedules</title>

<style>
:root{color-scheme:light;--weh:#e0e5f7;--bg:#f6f7f9;--fg:#1d2330;--mut:#636b7d;--line:#dfe3ea;--card:#fff;--acc:#3b6df0;--onacc:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--weh:#232842;--bg:#14171d;--fg:#e8ebf1;--mut:#8b93a5;--line:#2a2f3a;--card:#1c2029;--acc:#6b93ff;--onacc:#0d1220}}
:root[data-theme="dark"]{color-scheme:dark;--weh:#232842;--bg:#14171d;--fg:#e8ebf1;--mut:#8b93a5;--line:#2a2f3a;--card:#1c2029;--acc:#6b93ff;--onacc:#0d1220}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;height:100dvh;overflow:hidden}
main{display:flex;height:100vh;height:100dvh}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}button.d{color:#d33}
button:disabled{opacity:.4;cursor:default}
/* sidebar */
aside{position:relative;width:var(--sbw,290px);flex-shrink:0;border-right:1px solid var(--line);background:var(--card)}
aside.collapsed{width:46px}
#sbin{height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column}
#sbin>*{flex-shrink:0}
.rs{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:40}.rs:hover{background:var(--acc);opacity:.35}
aside.collapsed .rs,aside.collapsed .sbbody,aside.collapsed .lang,aside.collapsed .ttl,aside.collapsed .fav{display:none}
aside.collapsed #sbin{padding:12px 8px}aside.collapsed .sbtop{justify-content:flex-start;flex-direction:column;flex:1;margin-bottom:0}
.lvr{display:none}aside.collapsed .lvr{display:inline-flex;order:2}aside.collapsed .sbtop .xpand{order:1}aside.collapsed .gear{order:3;margin-top:auto}   /* rail: open, Live View, and the gear far from the chevron */
.lvr.on{background:#e5342d;color:#fff;border-color:#e5342d}
#sbBack{display:none}
@media (max-width:600px){aside:not(.collapsed){position:fixed;left:0;top:0;bottom:0;z-index:60;width:min(90vw,var(--sbw,290px));box-shadow:0 0 24px #0006}aside .rs{display:none}aside:not(.collapsed)~#sbBack{display:block;position:fixed;inset:0;z-index:55;background:#0007}}   /* phone: the open sidebar is a drawer over the grid (R-UI-13) */
@media (max-width:600px){.sbtop{gap:10px}.sbtop .eye{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}}   /* finger-sized, apart */
.sbtop{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-12px;z-index:4;background:var(--card);padding-top:12px;margin-top:-12px}
.fav{width:22px;height:22px}.ttl{font-weight:700;font-size:15px;flex:1;min-width:0}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.bgrid .full{grid-column:1/-1}
.bgrid button{font-size:12px;padding:6px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgrid svg{width:15px;height:15px;flex-shrink:0}
.tip{cursor:help;color:var(--acc);text-transform:none}
.sch{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.sch input[type=text]{flex:1 1 80px;min-width:0;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:3px 4px;border-radius:6px}
.sch input[type=text]:focus{border-color:var(--line)}
.sch .x{padding:0 6px;border:0;color:var(--mut)}
.sch .solo{font-size:11px;padding:1px 6px;border:1px solid var(--line);color:var(--mut)}
.sch .ic{flex-shrink:0}.sch .extb{color:var(--mut);margin:0}
.subh{display:flex;align-items:center;gap:6px;margin:6px 0 2px;padding-left:2px}.subh .shbtn{letter-spacing:.04em;font-size:11px}.subh small{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0}
.tbar{display:flex;gap:6px;margin-bottom:4px}.tbar button{flex:1;padding:7px 0;display:flex;justify-content:center;align-items:center}.tbar svg{width:17px;height:17px}
.pbtn{width:100%;margin-bottom:8px;padding:8px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.sech{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.shbtn{flex:1;display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.shbtn svg{width:14px;height:14px}.shbtn em{font-style:normal;font-weight:400;background:var(--bg);border-radius:10px;padding:0 7px}
.sch{min-height:32px;margin-bottom:2px;flex-wrap:nowrap}.sch.off input[type=text]{color:var(--mut)}
.omenu .oi svg{width:15px;height:15px;flex-shrink:0}.omenu .oi.d{color:#d33}.omenu .opw{color:var(--mut);cursor:default}.omenu .opw input{flex:1;min-width:0;accent-color:var(--acc)}
aside.collapsed .help{display:none}
.sch .opr{flex:0 0 calc(100% - 28px);min-width:0;margin:0 0 4px 28px;display:flex;align-items:center;gap:4px;color:var(--mut)}
.sch .opr .ic{margin:0}.sch .op{flex:1;min-width:0;width:auto;margin:0;accent-color:var(--acc);height:14px}
.eye{border:0;background:none;padding:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex-shrink:0}
.eye svg{width:19px;height:19px}.eye.off{color:var(--mut)}.eye.lk{color:#e8912d}
.ic{display:inline-flex;vertical-align:-3px;margin:0 4px 0 0}.ic svg{width:15px;height:15px}
.pick{cursor:pointer}.pick svg{width:19px;height:19px}
.hint{color:var(--mut);font-size:12px;margin:14px 0 0}
.lang{margin-top:auto;padding-top:16px}.lang label{margin:0 0 3px}
.lang select{width:100%;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
/* grid */
.wrap{flex:1;overflow:scroll;position:relative;min-width:0;scrollbar-color:var(--mut) var(--bg)}.wrap:focus{outline:0}.wrap:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.wrap::-webkit-scrollbar{width:14px;height:14px}.wrap::-webkit-scrollbar-track{background:var(--bg)}.wrap::-webkit-scrollbar-thumb{background:var(--mut);border-radius:8px;border:3px solid var(--bg)}.wrap::-webkit-scrollbar-corner{background:var(--bg)}
.grid{display:grid}
.dh{position:sticky;top:0;z-index:20;background-color:var(--card);background-image:linear-gradient(var(--line),var(--line));background-size:1px 100%;background-repeat:no-repeat;background-position:var(--lane,0px) 0;border-bottom:1px solid var(--line);padding:8px 8px 8px calc(8px + var(--lane,0px));text-align:center;font-weight:600;font-size:calc(14px * var(--ts,1))}
.dh.nr{padding:8px 2px 8px calc(2px + var(--lane,0px));white-space:nowrap;overflow:hidden}
.dh.we{background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--weh),var(--weh));background-size:1px 100%,calc(100% - var(--lane,0px)) 100%;background-position:var(--lane,0px) 0,var(--lane,0px) 0}
.dh.we.wj{background-size:1px 100%,100% 100%;background-position:var(--lane,0px) 0,0 0}
.dh.c{background-image:none;padding-left:8px;left:0;z-index:30}
.dh.c{padding:4px 2px}.wkb{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:2px 4px;font:inherit;font-weight:700;font-size:calc(12px * var(--ts,1));cursor:pointer;white-space:nowrap;max-width:100%}.wkb:hover{border-color:var(--acc)}.wkb i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e5484d;margin-left:3px;vertical-align:middle}
.dw{display:flex;min-width:0}.lane{flex:0 0 var(--lane,0px);width:var(--lane,0px);position:relative}.day{flex:1;min-width:0}
.lane .lbg{position:absolute;left:0;right:0}
.dhb{border:0;background:none;padding:2px;margin:0;border-radius:4px;color:var(--mut);line-height:0;vertical-align:middle}.dhb:hover:not(:disabled){color:var(--fg);background:var(--line)}.dhb svg{width:14px;height:14px}
.dh .foc{position:absolute;right:3px;top:50%;transform:translateY(-50%);opacity:0;background:var(--card)}.dh:hover .foc,.dh .foc:focus-visible{opacity:1}@media (hover:none){.dh .foc{opacity:.8}}   /* shown on hover, always on touch screens */
.dh.fo{display:flex;align-items:center;justify-content:center;gap:6px}.dh .wk{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid var(--line);font-size:12px;line-height:1}
.dh:not(.c){cursor:pointer}.dh:not(.c):hover{text-decoration:underline}.dh .ic{color:var(--mut)}
.times{position:sticky;left:0;z-index:15;background:var(--bg);box-shadow:1px 0 0 var(--line)}.times span{position:absolute;right:6px;transform:translateY(-50%);font-size:calc(11px * var(--ts,1));color:var(--mut);white-space:nowrap}
.day{position:relative;border-left:1px solid var(--line);user-select:none;touch-action:pan-x pan-y;-webkit-touch-callout:none}
.lane{touch-action:pan-x pan-y}#grid.fo .day,#grid.fo .lane{touch-action:pan-y}   /* the day view never scrolls sideways: a sideways swipe changes the day (R-UI-13) */
.gl{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.ev{position:absolute;left:3px;right:calc(3px + var(--gut,0px));border-radius:8px;padding:4px 7px;color:#fff;overflow:hidden;cursor:grab;font-size:calc(12px * var(--ts,1));box-shadow:0 1px 3px #0003;border:1px solid #0002}
.ev.locked{pointer-events:none;cursor:default}
/* activity types with the soft look (e.g. Free time): soft tint of the event colour with a solid colour edge */
.ev.soft{background:color-mix(in srgb,var(--c) 28%,var(--card))!important;color:var(--fg);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-left:4px solid var(--c)}
.ev.soft .r1,.ev.soft .r2,.ev.soft .clipm{text-shadow:none}.ev.soft .flags{color:var(--fg)}.ev.soft .flags svg{filter:none}.ev.soft.clipped::after{background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.12))}

/* flexible start/end (R-EVT-15): margins continue the core box (a box "around these times", R-EVT-12, is all margin: .mgo) with a dashed border and a translucent tint; they are inserted before every core box, so cores always cover them */
.mg{position:absolute;left:3px;right:calc(3px + var(--gut,0px));border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);cursor:grab}.mg.t{border-bottom:0}.mg.b{border-top:0}.mg.locked{pointer-events:none;cursor:default}
.mg.soft,.ev.mgo.soft{background:color-mix(in srgb,var(--c) 14%,transparent)!important}
.ev.mgo{background:color-mix(in srgb,var(--c) 30%,transparent)!important;color:var(--fg);border:2px dashed var(--c);box-shadow:none}.ev.mgo .r1,.ev.mgo .r2,.ev.mgo .clipm{text-shadow:none}.ev.mgo .flags{color:var(--fg)}.ev.mgo .flags svg{filter:none}
.phmode .mg{pointer-events:none!important;opacity:.35!important;filter:saturate(.4)}
.fflags label{font-weight:400}.fflags .ic{margin:0 4px 0 2px;vertical-align:-2px}.fflags .ic svg{width:14px;height:14px}
.igrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px}.igrid button{padding:5px;display:flex;justify-content:center;color:var(--fg)}.igrid button.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}.igrid svg{width:18px;height:18px}
#fTyIc svg{width:16px;height:16px}
.ev .r1,.ev .r2{position:relative;z-index:3;text-shadow:0 1px 2px #0008;line-height:1.25}
.ev .r1{display:flex;gap:8px;align-items:baseline}
.ev .r1 .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .r1 .tm{flex:0 0 auto;white-space:nowrap;opacity:.95}
.ev .r2{display:flex;flex-wrap:wrap;gap:0 8px;opacity:.95}.ev .r2 .wi{margin-left:auto;text-align:right}.ev .r2 .tm{white-space:nowrap}
/* resize handles live in the day column, above every box, so an overlapping box drawn later can never cover another one's bottom edge */
.rz{position:absolute;left:3px;right:calc(3px + var(--gut,0px));height:7px;transform:translateY(-100%);cursor:ns-resize;z-index:6}.rz.ph{left:0;right:0}
/* background activities by external people (R-EVT-17): slim strips in a gutter on the right of the day column, outside every lane */
.bgs{position:absolute;width:14px;border-radius:0 6px 6px 0;background:var(--c);cursor:grab;box-shadow:0 1px 2px #0003;overflow:hidden;display:flex;justify-content:center;box-sizing:border-box}.bgs.locked{pointer-events:none;cursor:default}
.bgs span{writing-mode:vertical-rl;font-size:10px;font-weight:600;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;padding:3px 0;pointer-events:none}
.bgs.flex{background:color-mix(in srgb,var(--c) 45%,transparent);border:2px dashed var(--c);border-left-width:0}.bgs.flex span{line-height:12px}.bgs.sel{box-shadow:0 0 0 2px var(--acc)}
.phmode .bgs{pointer-events:none!important;opacity:.35!important;filter:saturate(.4)}
.bgb{position:absolute;left:0;right:var(--gut,0px);pointer-events:none;background:linear-gradient(to left,var(--c),transparent)}.awl{position:absolute;pointer-events:none;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 32%,transparent) 0 4px,transparent 4px 10px)}.phmode .bgb{filter:saturate(.4)}
.ev .ic{background:#fff;border-radius:50%;padding:1px;vertical-align:-2px;margin-right:3px}.ev .ic svg{width:calc(10px * var(--ts,1));height:calc(10px * var(--ts,1))}
.ev .flags{position:absolute;top:3px;right:4px;z-index:5;display:flex;gap:3px;color:#fff;pointer-events:none}
.ev .flags span{display:flex}.ev .flags svg{width:calc(13px * var(--ts,1));height:calc(13px * var(--ts,1));filter:drop-shadow(0 1px 1px #000a)}
.ov{position:absolute;left:3px;right:calc(3px + var(--gut,0px));z-index:2;pointer-events:none;border-radius:4px}
.ghost{position:absolute;left:3px;right:3px;background:var(--acc);opacity:.3;border-radius:8px;pointer-events:none}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid #e5342d;z-index:6;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#e5342d}
/* dialogs & popups */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:18px;width:min(540px,95vw)}
dialog::backdrop{background:#0006}#xDlg{width:min(460px,95vw)}#xDlg.wide{width:min(760px,95vw)}#xDlg h3{margin:0 0 10px}.note{color:var(--mut);font-size:12px}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mut)}
dialog input[type=text],dialog textarea,dialog select{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}.row>div{flex:1}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px}.chk label,.radios label{display:flex;gap:5px;align-items:center;margin:2px 0;color:var(--fg);font-size:13px}
.btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}#dlg .btns{border-top:1px solid var(--line);padding-top:14px}.btns .d{margin-right:auto}
.swatch{width:100%;height:32px;border-radius:8px;padding:0}
/* event dialog (R-UI-07): label column + sections; day rows and their further-time lines share one column grid with their header */
#dlg{width:min(760px,96vw)}.dr.pulse>*{animation:rpulse 1.4s ease-out}@keyframes rpulse{0%,35%{background-color:color-mix(in srgb,var(--acc) 30%,var(--card));box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}}@media (prefers-reduced-motion:reduce){.dr.pulse>*{animation:none;background-color:color-mix(in srgb,var(--acc) 22%,var(--card))}}#dlg.moved{margin:0;right:auto;bottom:auto}.dgrip{display:flex;justify-content:center;width:calc(100% + 36px);margin:-16px -18px 2px;height:18px;padding:3px 0;border:0;border-radius:14px 14px 0 0;background:none;color:var(--mut);cursor:move;touch-action:none}.dgrip svg{width:30px;height:15px}.dgrip:hover,.dgrip:focus-visible{color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.fg{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 10px;align-items:center}.fg>label{margin:0;font-size:13px}
.fcell{display:flex;gap:8px;align-items:center;min-width:0}.fcell>select,.fcell>input{flex:1;min-width:0}.fcell .swatch{flex:0 0 44px;width:44px}.fcell>.ic:empty{display:none}
.fsec{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.fsec::after{content:'';flex:1;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{position:relative;display:inline-flex;align-items:center;gap:4px;margin:0;padding:3px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;color:var(--fg);background:var(--bg)}
.chips label .ic{margin:0}.chips input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}.chips label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.chips label:has(input:checked)::before{content:'✓';font-weight:700;color:var(--acc)}.chips label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:1px}.chips:not(:has(label)){font-size:13px;color:var(--mut)}
#fFit{display:flex;flex-direction:column;gap:4px;align-items:flex-start}#fDraw{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:13px}#fDraw>span{color:var(--mut)}#fFit label:has(input:disabled){opacity:.5}#fFit label{display:inline-flex;gap:5px;align-items:center;margin:0;color:var(--fg);font-size:13px}

#paneQ{display:grid;grid-template-columns:var(--dc);gap:6px;align-items:center;margin-top:8px}.dr,.dhd,#fDays{display:contents}
/* a long list of times scrolls inside the dialog under a header that stays put (the empty header cells and the shadows cover the ⧉/+/⚠ columns and the gaps) */
#paneQ{max-height:min(420px,50vh);overflow-y:auto;overscroll-behavior:contain;padding-right:4px}.dhd>span{position:sticky;top:0;z-index:2;align-self:stretch;background:var(--card);box-shadow:-6px 0 0 var(--card),0 6px 0 var(--card),-6px 6px 0 var(--card)}
#paneQ{--dc:auto minmax(68px,1fr) minmax(68px,1.35fr) minmax(0,1.3fr) minmax(0,1fr) 44px minmax(0,1.5fr) auto auto 18px}
.cbtn{width:28px;height:28px;padding:0;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;justify-self:start;box-shadow:inset 0 0 0 2px var(--card)}.cbtn svg{width:14px;height:14px}.dr.off .cbtn{opacity:.4}
.cmenu{position:fixed}.cmenu .oi i{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid var(--line)}.cmenu .oi.on::after{content:'✓';margin-left:auto;color:var(--acc);font-weight:700}
#dlg.ph #paneQ{--dc:auto minmax(68px,1fr) minmax(68px,1.35fr) auto auto 18px}
.wbtn{font-size:12px;padding:5px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.wbtn.def{color:var(--mut);font-style:italic}.cpy{padding:3px 7px;font-size:14px;line-height:1}.dr.off .wbtn,.dr.off .cpy{opacity:.4}

function applyStatic(){
  document.querySelectorAll('dialog').forEach(root=>{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];let n;while(n=w.nextNode())ns.push(n);
    ns.forEach(n=>{if(n.__en===undefined){if(!n.nodeValue.trim())return;n.__en=n.nodeValue}n.nodeValue=tr(n.__en)});
    root.querySelectorAll('[title]').forEach(e=>{if(e.__t===undefined)e.__t=e.title;e.title=tr(e.__t)});
  });
}

  return [h,s,l];

function hslToHex(h,s,l){

function pickColor(anchor,init,cb){
  document.querySelectorAll('.cpop').forEach(x=>x.remove());
  const pop=el('div','cpop',anchor.closest('dialog')||document.body);
  let [h,s,l]=hexToHsl(normHex(init)||'#3b6df0');
  const sw=el('div','sws',pop);
  SWATCHES.forEach(c=>{const b=el('button','sw',sw);b.type='button';b.style.background=c;b.onclick=()=>{[h,s,l]=hexToHsl(c);sync()}});
  const mk=(min,max,step,fn)=>{const r=el('input','',pop);r.type='range';r.min=min;r.max=max;r.step=step;r.oninput=()=>{fn(+r.value);sync(r)};return r};
  const hs=mk(0,359,1,v=>h=v),ss=mk(0,100,1,v=>s=v/100),ls=mk(8,92,1,v=>l=v/100);
  const row=el('div','cpr',pop),pv=el('div','pv',row),hx=el('input','',row);hx.type='text';hx.maxLength=7;
  const cur=()=>hslToHex(h,s,l);
  function sync(src){const c=cur();pv.style.background=c;if(src!==hx)hx.value=c;if(src!==hs)hs.value=h;if(src!==ss)ss.value=s*100;if(src!==ls)ls.value=l*100}
  const close=()=>{pop.remove();document.removeEventListener('pointerdown',outside,true)};
  const apply=()=>{const c=cur();close();cb(c)};
  const outside=e=>{if(!pop.contains(e.target))close()};
  hx.oninput=()=>{const n=normHex(hx.value);if(n){[h,s,l]=hexToHsl(n);sync(hx)}};
  hx.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();apply()}};
  pop.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}};
  const bt=el('div','btns',pop);
  const c1=el('button','',bt);c1.type='button';c1.textContent=L('pcCancel');c1.onclick=close;
  const c2=el('button','p',bt);c2.type='button';c2.textContent=L('pcApply');c2.onclick=apply;
  sync();
  const r=anchor.getBoundingClientRect();
  pop.style.left=Math.max(6,Math.min(r.left,innerWidth-250))+'px';
  pop.style.top=Math.max(6,Math.min(r.bottom+6,innerHeight-pop.offsetHeight-6))+'px';
  setTimeout(()=>document.addEventListener('pointerdown',outside,true));
  hx.focus();
}

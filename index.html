<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Weekly Schedules</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='white' stroke='%233b6df0' stroke-width='2.5'/%3E%3Crect x='3' y='5' width='26' height='9' rx='4' fill='%233b6df0'/%3E%3Cpath d='M10 2v6M22 2v6' stroke='%233b6df0' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M8 19h4M14 19h4M20 19h4M8 24h4M14 24h4' stroke='%233b6df0' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<style id="pgStyle"></style></head><body>
<main><aside id="sb"><div class="rs" id="rs"></div><div id="sbin"></div></aside><div id="sbBack"></div>
<div class="wrap" id="wrap" tabindex="0" role="region" aria-label="Week grid"><div class="grid" id="grid"></div></div></main>
<div id="pills"><button id="lvPill" type="button" style="display:none"><i></i><span></span></button><button id="hid" style="display:none"></button></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<dialog id="dlg"><button type="button" class="dgrip" id="dGrip" title="Drag to move this window and see what is behind it (the arrow keys move it too). It opens in the middle again next time."><svg viewBox="0 0 24 12" fill="currentColor"><circle cx="6" cy="3" r="1.6"/><circle cx="12" cy="3" r="1.6"/><circle cx="18" cy="3" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="18" cy="9" r="1.6"/></svg></button><form method="dialog" id="f">
<div class="dtabs" role="tablist"><button type="button" role="tab" data-p="ev"><span class="ev-only">Event</span><span class="ph-only">Phase</span></button><button type="button" role="tab" data-p="wh">When</button><button type="button" role="tab" data-p="mo"><span class="ev-only">More</span><span class="ph-only">Rhythms</span></button></div>
<div class="dpane" data-p="ev" role="tabpanel">
<div class="fg">
<label for="fT">Title *</label><div class="fcell"><input type="text" id="fT"><button type="button" class="swatch" id="fC" title="Colour"></button></div>
<label for="fD">Description</label><textarea id="fD" rows="2"></textarea>
<label for="fTy" class="ev-only" title="What kind of activity this is (Sleep, Meal, Work/School…), for the whole event. Its icon is shown on the event. Manage the list in the sidebar under Activity types.">Activity type</label><div class="fcell ev-only"><span id="fTyIc" class="ic"></span><select id="fTy" aria-label="Activity type"></select></div>
</div>
<div class="fsec ev-only"><span>Who</span></div>
<div class="fg ev-only">
<label for="fOw" title="The person who owns the task's conception, planning and execution, not necessarily the one who performs it. By default the owner performs it too; any day can have someone else stepping in, in the table below. Only our own people (not external ones) can own a task.">Owner</label><div class="fcell"><span id="fOwIc" class="ic"></span><select id="fOw"></select></div>
<label title="The people involved on every day, unless a day has its own list in the table below (its With button).">With</label><div><div class="chips" id="fInv"></div></div>
<label id="fTuL" for="fTuM" title="Whether this event counts turns, and how many times each person is responsible for it over the cycle. Automatic: when two or more people are responsible (a person on each day, or on each week with Different per week). A rota kept as an owner and the people in it as involved people has no turns to count.">Turns</label><div class="tuc"><select id="fTuM"></select><span id="fTu" class="tu"></span></div>
</div>
</div>
<div class="dpane" data-p="wh" role="tabpanel">
<div class="fsec"><span>When</span></div>
<div id="fWk" class="wkrow"></div>
<div id="paneQ"><div class="dhd"><span title="Tick the days this event repeats on. Each day has its own times, the person who performs it, the people involved and its timing; a newly ticked day starts from the nearest ticked day. + adds another time on that day, ⧉ makes other ticked days like this one: all of them, the ones below or the ones above.">Days</span><span class="wkh" title="With different times per week: the week of the cycle each time is in.">Week</span><span>Start</span><span>End</span><span class="ev-only" title="Who performs it on that day: the owner (follows the owner if it changes), nobody (it concerns everyone), or someone stepping in.">Performed by</span><span class="ev-only" title="The people involved on that day: Default follows the list above; click to give the day its own list.">With</span><span class="ev-only" title="The colour of this time on the grid: the event's colour (the default), the colour of the person who performs it (it follows the performer), the colour of the event's activity type (it follows the type), or one of its own. ⧉ copies it to the other days.">Colour</span><span class="ev-only" title="Fixed: the times are exact. Flexible start/end: may start a bit late and/or finish a bit early (the fixed part is a normal box, the flexible parts lighter dashed extensions). Around these times: happens around these times but may take less; the whole box is lighter and dashed. Flexible parts never clash with other activities of the same people, which may cover them, as long as an activity around these times keeps some of its time free. Other people's activities go beside them, not over them.">Timing</span><span></span><span></span><span></span></div>
<div id="fDays"></div><button type="button" id="fAddT" class="addtm" title="Adds a time on a day you choose (and, with different times per week, in a week you choose).">+ Add a time</button></div>
<div class="warnline" id="fWarn"></div>
</div>
<div class="dpane" data-p="mo" role="tabpanel">
<div class="fsec ev-only"><span title="Event-wide switches that change how this event interacts with the others.">How it fits in</span></div>
<div class="fflags ev-only" id="fFit"><div id="fOcRow"><label title="They are only available (for example at hand to answer the cleaner's questions), not busy: the event never clashes with their other activities and does not count in their statistics."><input type="checkbox" id="fOnCall">Involved people are only on call</label></div><label title="For small tasks done along the way, such as picking up the post on the way back from lunch. When it falls completely within other activities of its responsible person (one or several in a row), it is drawn as a small box inside them instead of as a conflict, its time counts for it in the statistics, and it moves along when you drag the activity it is in."><input type="checkbox" id="fNest">Can be done during the person's other activities</label><div id="fDraw" role="radiogroup" aria-labelledby="fDrawL"><span id="fDrawL" title="How the event is drawn and how it meets the others: a box, a strip in the background, or a strip saying that its people are away.">Drawn as</span><label title="A normal box, with the overlap rules of every activity."><input type="radio" name="fdr" id="fBox">Box</label><label title="For things that happen in the background without keeping the household/workplace busy: the cleaner at work, quiet hours, or screen-free time. Drawn as a strip at the right edge of the day, never a conflict with anything, and left out of the statistics. Strips are never nested, so the option above is off while this is ticked."><input type="radio" name="fdr" id="fBg">In the background (doesn't keep us busy)</label><label title="For people who are away for a while: a child at the other parent's every other weekend, a business trip, a training course. Its performer and involved people are away: drawn as a hatched strip, and their activities at that time (also when only on call), and activities without a responsible person, are striped with ⚠. Its time is its own line in the statistics. Away needs at least one person."><input type="radio" name="fdr" id="fAw">Away</label></div></div>
<div class="fsec"><span class="ev-only" title="At least one. Tick several to make the event appear in each one; editing it then updates all of them.">Schedules *</span><span class="ph-only" title="At least one. Tick several to make the phase appear in each rhythm. Use Copy… to copy it into another rhythm as an independent phase.">Rhythms *</span></div><div class="chips" id="fSch"></div>
</div>
<div class="err" id="err"></div>
<div class="btns"><button class="d" id="fDel" type="button" title="Deletes the event including every repeated day. To remove a single day, untick it under Days and save.">Delete</button><button type="button" id="fCopy" title="Copy this event to another schedule, choosing the colour of the copy.">Copy…</button><button type="button" id="fCancel">Cancel</button><button type="button" class="p" id="fOk">Save</button></div>
</form></dialog>
<dialog id="agDlg"><div class="agenda" id="agBody"></div>
<div class="btns"><button id="agClose">Close</button><button id="agPrint2"></button><button id="agPrint" class="p">Print agenda</button></div></dialog>
<dialog id="xDlg"></dialog>
<div id="pr"></div><div id="toast"></div><div id="peek"></div>
<script src="js/state.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/basics.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/share.js" defer></script>
<script src="js/ics.js" defer></script>
<script src="js/model.js" defer></script>
<script src="js/stats.js" defer></script>
<script src="js/sidebar.js" defer></script>
<script src="js/grid.js" defer></script>
<script src="js/dialog.js" defer></script>
<script src="js/main.js" defer></script>
</body></html>

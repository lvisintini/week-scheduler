# Settings for kiosk-data.sh: your workspace from a private GitHub repository
# (step 10 of docs/kiosk/README.md). This file holds your own settings.

# The private repository, as its SSH address (on GitHub: Code -> SSH).
REPO="git@github.com:YOUR-NAME/YOUR-PRIVATE-REPO.git"
BRANCH="main"

# The encrypted JSON file saved from the planner (Save... -> JSON file, Encrypted),
# as its path inside the repository.
FILE="weekly-schedules.json"

# The planner's address.
APP="https://lvisintini.github.io/week-scheduler/"

# Layout the planner opens in: "phone" (the touch view), "desk" (the computer
# layout) or "" (leave it as chosen in the planner's Settings).
LAYOUT="phone"
